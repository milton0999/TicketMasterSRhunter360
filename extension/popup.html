<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TicketMasterSRhunter360</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <div id="header">
    <img src="icon48.png" class="logo" alt="logo">
    <div id="headerInfo">
      <span id="headerTitle">TicketMasterSRhunter360</span>
      <span id="headerUser">—</span>
    </div>
    <div id="headerRight">
      <span id="areaBadge" class="area-badge"></span>
      <span id="ticketCount" class="count-badge">0 tickets</span>
      <button id="btnRefresh" title="Refresh">↺</button>
    </div>
  </div>

  <!-- Not logged in -->
  <div id="notLoggedIn" style="display:none;">
    <div class="empty-msg">
      <div>Not logged in to TicketMasterSRhunter360</div>
      <div class="sub">Open the app and log in first</div>
      <button id="btnOpenApp" class="btn-primary">Open App</button>
    </div>
  </div>

  <!-- No area -->
  <div id="noArea" style="display:none;">
    <div class="empty-msg">
      <div>No area assigned</div>
      <div class="sub">Your account has no SM or Merge access</div>
    </div>
  </div>

  <!-- Notes popover -->
  <div id="notesPopover">
    <div id="notesPopoverTitle">Notes</div>
    <textarea id="notesPopoverArea" placeholder="Escribe notas…"></textarea>
    <div id="notesPopoverActions">
      <button class="pop-btn pop-btn-close" id="btnPopClose">Cancelar</button>
      <button class="pop-btn pop-btn-save"  id="btnPopSave">Guardar</button>
    </div>
  </div>

  <!-- Main table -->
  <div id="tableWrap" style="display:none;">
    <table id="ticketTable">
      <thead>
        <tr>
          <th class="col-bar"></th>
          <th class="col-id">ID</th>
          <th class="col-subj">Subject</th>
          <th class="col-proc">
            Processor
            <select id="filterProcessor" class="th-sel"><option value="">All</option></select>
          </th>
          <th class="col-notes">Notes</th>
          <th class="col-date">PS</th>
          <th class="col-date">ES</th>
          <th class="col-status">
            My Status
            <select id="filterStatus" class="th-sel"><option value="">All</option></select>
          </th>
        </tr>
      </thead>
      <tbody id="ticketBody"></tbody>
    </table>
    <div id="emptyState" style="display:none;" class="empty-msg">No tickets in active shift</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
